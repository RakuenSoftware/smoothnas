apiVersion: smoothnas.io/v1
kind: Plugin
metadata:
  name: ubuntu-python
  version: 0.1.0
  description: Ubuntu Jammy with Python and a custom service
  vendor: smoothnas
services:
  - name: ubuntu-python
    artifact:
      type: lxc-distro
      distro: ubuntu
      release: jammy
      arch: amd64
      packages:
        - python3
        - python3-pip
      setup:
        - pip install --break-system-packages mything==1.2.3
        - useradd -m worker
    container:
      command: ["/usr/bin/mything", "--bind", "0.0.0.0:8080"]
      restartPolicy: unless-stopped
    volumes:
      - name: data
        mode: flat
        bind: /var/lib/mything
    ports:
      - name: http
        port: 8080
        protocol: tcp
        expose: true
    config:
      - key: MYTHING_LOG_LEVEL
        type: string
        default: info
