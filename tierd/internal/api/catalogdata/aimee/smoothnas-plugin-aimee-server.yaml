# aimee-server — the agent/memory broker, as a plain docker-compose plugin.
#
# Standalone: DB1 (a self-contained, user-scoped SQLite store) only. Serves BOTH
# the authenticated /v1 HTTP API and the webchat browser UI (HTTPS :8443). For
# shared/vector memory install the `aimee-combined` plugin instead. The only
# SmoothNAS extensions are the top-level x-smoothnas block (catalog display + UI
# embed + operator config) and x-smoothnas.tier on the named volumes — the file
# is otherwise plain compose.
name: aimee-server
services:
  aimee-server:
    image: ghcr.io/rakuensoftware/aimee-server:latest
    restart: unless-stopped
    ports:
      - "8740:8740" # authenticated /v1 JSON API (bearer on every request)
      - "8443:8443" # webchat UI (HTTPS)
    volumes:
      - home:/var/lib/aimee              # DB1 (aimee.db) + server state
      - workspaces:/var/lib/aimee-workspaces # per-workspace mirrors + worktrees
    environment:
      AIMEE_KB_API_URL: "${AIMEE_KB_API_URL:-}"
      AIMEE_KB_API_BEARER_TOKEN: "${AIMEE_KB_API_BEARER_TOKEN:-}"
      AIMEE_WEBCHAT_ENABLED: "${AIMEE_WEBCHAT_ENABLED:-true}"
      AIMEE_WEBCHAT_USER: "${AIMEE_WEBCHAT_USER:-}"
      AIMEE_WEBCHAT_PASSWORD: "${AIMEE_WEBCHAT_PASSWORD:-}"
volumes:
  home:
    x-smoothnas: { tier: HDD }
  workspaces:
    x-smoothnas: { tier: HDD }
x-smoothnas:
  description: >-
    aimee agent/memory broker — serves the /v1 HTTP API backed by a
    self-contained SQLite store (DB1). Runs standalone; optionally federates to
    an aimee-kb plugin for shared/vector memory.
  vendor: RakuenSoftware
  homepage: https://github.com/RakuenSoftware/aimee
  ui:
    service: aimee-server
    port: 8443
    path: /
  config:
    - key: AIMEE_KB_API_URL
      label: aimee-kb API URL
      type: string
      default: ""
      description: >-
        Optional. URL of a running aimee-kb /v1 endpoint (e.g.
        http://10.0.0.5:8741) to enable shared/vector memory. Blank = standalone.
    - key: AIMEE_KB_API_BEARER_TOKEN
      label: aimee-kb bearer token
      type: string
      secret: true
      description: Optional bearer token presented to the configured aimee-kb endpoint.
    - key: AIMEE_WEBCHAT_ENABLED
      label: Browser webchat UI
      type: bool
      default: "true"
      description: >-
        Browser UI on HTTPS :8443 (first-class, on by default). Turn off to serve
        the /v1 API only.
    - key: AIMEE_WEBCHAT_USER
      label: Webchat login user
      type: string
      default: ""
      description: PAM login username for the browser UI (set with a password to enable sign-in).
    - key: AIMEE_WEBCHAT_PASSWORD
      label: Webchat login password
      type: string
      secret: true
      description: PAM login password for the browser UI (set alongside the user).
