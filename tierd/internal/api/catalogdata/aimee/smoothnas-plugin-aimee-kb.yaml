# aimee-kb — shared, vector-backed memory over the /v1 HTTP API, as a plain
# docker-compose plugin. Self-contained: bundles its pgvector Postgres + the
# embedder, wired by compose service discovery (no operator input for internal
# endpoints). API-only — no webchat UI, so no x-smoothnas.ui block. The only
# SmoothNAS extensions are the top-level x-smoothnas block (catalog display +
# operator config) and x-smoothnas.tier on the named volumes.
name: aimee-kb
services:
  # pgvector Postgres. uid 1000:1000 matches the smoothfs forced-owner on the
  # tier-bound data volume so the server can write its data dir.
  postgres:
    image: pgvector/pgvector:pg17
    user: "1000:1000"
    restart: unless-stopped
    environment:
      POSTGRES_DB: aimee_shared
      POSTGRES_USER: aimee
      POSTGRES_PASSWORD: aimee
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimee -d aimee_shared"]
      interval: 10s
      timeout: 5s
      retries: 5
  # Embedding service; internal-only (reached as embedder:8080 on the compose
  # network), so no published port. The model cache lives on a tier-bound volume.
  embedder:
    image: ghcr.io/rakuensoftware/aimee-embedder:latest
    restart: unless-stopped
    volumes:
      - models:/opt/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  kb:
    image: ghcr.io/rakuensoftware/aimee-kb:latest
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      embedder: { condition: service_healthy }
    environment:
      AIMEE_DB2_URL: postgresql://aimee:aimee@postgres:5432/aimee_shared
      AIMEE_EMBEDDER_URL: http://embedder:8080
      AIMEE_KB_HTTP_BIND: "1"
      LLM_ENDPOINT: "${LLM_ENDPOINT:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
    volumes:
      - home:/var/lib/aimee
    ports:
      - "8741:8741" # authenticated /v1 KB API
volumes:
  # tier-bound: smoothfs storage-pool placement, resolved to a host bind by tierd.
  pgdata:
    x-smoothnas: { tier: HDD }
  models:
    x-smoothnas: { tier: HDD }
  home:
    x-smoothnas: { tier: HDD }
x-smoothnas:
  description: >-
    aimee knowledge base — shared, vector-backed memory over the /v1 HTTP API.
    Self-contained: bundles its pgvector Postgres and embedder, so there is no
    external database or embedder to configure.
  vendor: RakuenSoftware
  homepage: https://github.com/RakuenSoftware/aimee
  config:
    - key: LLM_ENDPOINT
      label: LLM endpoint (optional)
      type: string
      default: ""
      description: >-
        Optional. OpenAI-compatible endpoint (e.g. http://10.0.0.7:8080/v1) to
        enable the candidate-synthesis and curator passes. Blank = disabled.
    - key: LLM_MODEL
      label: LLM model (optional)
      type: string
      default: ""
      description: Optional. Model name to request from the LLM endpoint.
