# aimee-kb — self-contained knowledge base (DB2 + pgvector).
#
# Serves the /v1 HTTP API and owns the shared, vector-backed memory store.
# As a compose-style SmoothNAS plugin (smoothnas.io/v1 services), this brings
# up its OWN pgvector Postgres and embedder alongside the kb — no external
# infrastructure to stand up or configure. The kb reaches its siblings over the
# plugin bridge via service-discovery tokens ({{service.<name>.host}}).
#
# Storage: all volumes are tier-bound, so the Postgres database, the embedder
# model, and the kb state live on a storage tier of your choosing — NOT the
# small OS/root device. Pick the target tier at install time (the per-volume
# slot below is the home tier within that pool; smoothfs promotes hot data
# upward automatically). Postgres runs as uid 1000 because SmoothNAS tiers
# (smoothfs) present a uniform owner of uid 1000, and the stock postgres image
# would otherwise drop to its own user and be unable to access its data dir.
# (Honoring the container user requires the runtime from SmoothNAS v0.1.20+.)
#
# Images:
#   ghcr.io/rakuensoftware/aimee-kb         (kb)
#   pgvector/pgvector:pg17                  (Postgres, public)
#   ghcr.io/rakuensoftware/aimee-embedder   (embedder — published from
#                                            Dockerfile.embedder; see release CI)
apiVersion: smoothnas.io/v1
kind: Plugin
metadata:
  name: aimee-kb
  version: 0.2.5
  description: >-
    aimee knowledge base — shared, vector-backed memory over the /v1 HTTP API.
    Self-contained: bundles its pgvector Postgres and embedder, so there is no
    external database or embedder to configure.
  vendor: RakuenSoftware
  homepage: https://github.com/RakuenSoftware/aimee
services:
  # Bundled pgvector Postgres backing DB2. Brought up first; the kb waits for
  # it to pass its healthcheck before starting.
  - name: postgres
    artifact:
      type: oci-image
      image: pgvector/pgvector:pg17
    container:
      restartPolicy: unless-stopped
      # SmoothNAS tiers (smoothfs) force a uniform owner of uid 1000 on their
      # files. The stock postgres image runs PID 1 as root and drops to the
      # postgres user (uid 999), which then can't access its uid-1000-owned
      # data dir. Run it as uid 1000 so it owns its data. (Requires a runtime
      # that honors the container user — SmoothNAS v0.1.20+.)
      user: "1000:1000"
    env:
      POSTGRES_DB: aimee_shared
      POSTGRES_USER: aimee
      POSTGRES_PASSWORD: aimee
    volumes:
      - name: pgdata
        # Tier-bound: the database lives on the assigned storage tier, not the
        # root device. HDD is the home slot; smoothfs caches hot pages upward.
        mode: tier-bound
        bind: /var/lib/postgresql/data
    health:
      test: ["CMD-SHELL", "pg_isready -U aimee -d aimee_shared"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bundled embedder: holds all-MiniLM-L6-v2 resident and serves /embed over
  # HTTP so the kb embeds without reloading the model per call.
  - name: embedder
    artifact:
      type: oci-image
      image: ghcr.io/rakuensoftware/aimee-embedder:latest
    container:
      restartPolicy: unless-stopped
    volumes:
      - name: models
        # Tier-bound: the embedder model cache lives on the assigned tier.
        mode: tier-bound
        bind: /opt/models
    ports:
      - name: http
        port: 8080
        protocol: tcp
        expose: false
    health:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      startPeriod: 30s

  # The kb itself. Reaches postgres + embedder over the plugin bridge; both
  # URLs are rendered from sibling service discovery, so nothing to configure.
  - name: kb
    artifact:
      type: oci-image
      image: ghcr.io/rakuensoftware/aimee-kb:latest
    container:
      # Image default CMD is ["--http-port=8741"]; AIMEE_KB_HTTP_BIND=1 binds
      # the listener on 0.0.0.0.
      restartPolicy: unless-stopped
    dependsOn:
      postgres:
        condition: service_healthy
      embedder:
        condition: service_healthy
    env:
      AIMEE_DB2_URL: postgresql://aimee:aimee@{{service.postgres.host}}:5432/aimee_shared
      AIMEE_EMBEDDER_URL: http://{{service.embedder.host}}:8080
      AIMEE_KB_HTTP_BIND: "1"
    volumes:
      # kb state and baked config under AIMEE_HOME.
      - name: home
        # Tier-bound: kb state/config lives on the assigned tier.
        mode: tier-bound
        bind: /var/lib/aimee
    ports:
      - name: api
        port: 8741
        protocol: tcp
        expose: false
        hostExpose: true
    config:
      # Optional OpenAI-compatible LLM endpoint enabling the synthesis /
      # curator passes. Blank leaves them disabled (they fail closed).
      - key: LLM_ENDPOINT
        type: string
        label: LLM endpoint (optional)
        default: ""
        description: >-
          Optional. OpenAI-compatible endpoint (e.g. http://10.0.0.7:8080/v1) to
          enable the candidate-synthesis and curator passes. Blank = disabled.
      - key: LLM_MODEL
        type: string
        label: LLM model (optional)
        default: ""
        description: Optional. Model name to request from the LLM endpoint.
