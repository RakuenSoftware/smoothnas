# aimee-combined — server + knowledge base in one plugin, with bundled pgvector
# Postgres and embedder, as a plain docker-compose project. The full /v1 surface
# AND the webchat browser UI (HTTPS :8443) plus shared/vector memory as a single
# self-contained plugin, wired by compose service discovery. The only SmoothNAS
# extensions are the top-level x-smoothnas block (display + UI embed + operator
# config) and x-smoothnas.tier on the named volumes.
name: aimee-combined
services:
  # pgvector Postgres. uid 1000:1000 matches the smoothfs forced-owner on the
  # tier-bound data volume so the server can write its data dir.
  postgres:
    image: pgvector/pgvector:pg17
    user: "1000:1000"
    restart: unless-stopped
    environment:
      POSTGRES_DB: aimee_shared
      POSTGRES_USER: aimee
      POSTGRES_PASSWORD: aimee
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimee -d aimee_shared"]
      interval: 10s
      timeout: 5s
      retries: 5
  # Embedding service; internal-only (reached as embedder:8080), no published port.
  embedder:
    image: ghcr.io/rakuensoftware/aimee-embedder:latest
    restart: unless-stopped
    volumes:
      - models:/opt/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  server-kb:
    image: ghcr.io/rakuensoftware/aimee-server-kb:latest
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      embedder: { condition: service_healthy }
    environment:
      AIMEE_DB2_URL: postgresql://aimee:aimee@postgres:5432/aimee_shared
      AIMEE_EMBEDDER_URL: http://embedder:8080
      AIMEE_SERVER_HTTP_BIND: "1"
      AIMEE_KB_HTTP_BIND: "1"
      LLM_ENDPOINT: "${LLM_ENDPOINT:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      AIMEE_WEBCHAT_ENABLED: "${AIMEE_WEBCHAT_ENABLED:-true}"
      AIMEE_WEBCHAT_USER: "${AIMEE_WEBCHAT_USER:-}"
      AIMEE_WEBCHAT_PASSWORD: "${AIMEE_WEBCHAT_PASSWORD:-}"
    volumes:
      - home:/var/lib/aimee
      - workspaces:/var/lib/aimee-workspaces
    ports:
      - "8740:8740" # authenticated /v1 JSON API
      - "8443:8443" # webchat UI (HTTPS)
volumes:
  pgdata:
    x-smoothnas: { tier: HDD }
  models:
    x-smoothnas: { tier: HDD }
  home:
    x-smoothnas: { tier: HDD }
  workspaces:
    x-smoothnas: { tier: HDD }
x-smoothnas:
  description: >-
    aimee server + knowledge base in one plugin, with bundled pgvector Postgres
    and embedder — the full /v1 surface, webchat UI, and shared/vector memory as
    a single self-contained plugin. No external database or embedder to configure.
  vendor: RakuenSoftware
  homepage: https://github.com/RakuenSoftware/aimee
  ui:
    service: server-kb
    port: 8443
    path: /
  config:
    - key: LLM_ENDPOINT
      label: LLM endpoint (optional)
      type: string
      default: ""
      description: >-
        Optional. OpenAI-compatible endpoint to enable the kb synthesis / curator
        passes. Blank = disabled.
    - key: LLM_MODEL
      label: LLM model (optional)
      type: string
      default: ""
      description: Optional. Model name to request from the LLM endpoint.
    - key: AIMEE_WEBCHAT_ENABLED
      label: Browser webchat UI
      type: bool
      default: "true"
      description: >-
        Browser UI on HTTPS :8443 (first-class, on by default). Turn off to serve
        the /v1 API only.
    - key: AIMEE_WEBCHAT_USER
      label: Webchat login user
      type: string
      default: ""
      description: PAM login username for the browser UI (set with a password to enable sign-in).
    - key: AIMEE_WEBCHAT_PASSWORD
      label: Webchat login password
      type: string
      secret: true
      description: PAM login password for the browser UI (set alongside the user).
