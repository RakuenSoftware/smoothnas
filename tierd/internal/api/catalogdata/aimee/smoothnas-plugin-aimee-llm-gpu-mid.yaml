# aimee-llm (GPU, mid tier) — a plain docker-compose plugin. Unified Vulkan
# llama.cpp: embeddings, reranking, and Gemma-4-26B-A4B (MoE, 4B active) synthesis from baked-in GGUFs. Standalone;
# back the aimee-kb plugin's embedder/LLM endpoint with it. ~14GB fits a 24GB card.
#
# GPU passthrough is PLAIN compose (no SmoothNAS profile catalog): devices +
# device_cgroup_rules bind the host /dev/dri render tree and grant char-major 226
# (DRM) — the same access the native gpu-amd profile applied. pids_limit +
# oom_score_adj carry the native default-limits. The only SmoothNAS extension is
# the top-level x-smoothnas block (display + operator config); no volumes (GGUFs
# are baked into the image), API-only so no ui block.
name: aimee-llm-gpu-mid
services:
  llm:
    image: ghcr.io/rakuensoftware/aimee-kb-gpu-mid:latest
    restart: unless-stopped
    environment:
      AIMEE_LLM_NGL: "99"
      AIMEE_LLM_PORT: "8742"
      AIMEE_LLM_SYNTH_CTX: "${AIMEE_LLM_SYNTH_CTX:-262144}"
      AIMEE_LLM_AUTH_TOKEN: "${AIMEE_LLM_AUTH_TOKEN:-}"
    ports:
      - "8742:8742" # OpenAI-compatible gateway
    devices:
      - "/dev/dri:/dev/dri" # AMD/Intel GPU render tree (gpu-amd equivalent)
    device_cgroup_rules:
      - "c 226:* rwm" # DRM char-major 226
    pids_limit: 1024
    oom_score_adj: 100
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8742/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s
x-smoothnas:
  description: >-
    aimee-llm (GPU, mid tier) — unified Vulkan llama.cpp: embeddings, reranking,
    and Gemma-4-26B-A4B (MoE, 4B active) synthesis from baked-in GGUFs. Standalone; back the aimee-kb plugin's
    embedder/LLM endpoint with it.
  vendor: RakuenSoftware
  homepage: https://github.com/RakuenSoftware/aimee
  config:
    - key: AIMEE_LLM_SYNTH_CTX
      label: Synthesis context (tokens)
      type: number
      default: "262144"
      min: "4096"
      unit: tokens
      description: >-
        Context window for the synthesis model. gpu-mid bakes SYNTH_SLOTS=2, so this is split 2 x 128K. Gemma's sliding-window KV is cheap; 256K total fits alongside the resident MoE synth on a 24GB card. Lower it only if the
        container logs a VRAM allocation failure.
    - key: AIMEE_LLM_AUTH_TOKEN
      label: Bearer token (optional)
      type: string
      secret: true
      description: >-
        Optional. When set, the gateway requires Authorization: Bearer <token> on
        every request. LEAVE BLANK when this backs aimee-kb (the kb embed path
        sends no bearer and would get 401s). Provide from the secret store at
        deploy time, never checked into git.
