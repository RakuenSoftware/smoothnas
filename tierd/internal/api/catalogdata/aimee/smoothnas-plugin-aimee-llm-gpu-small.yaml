# aimee-llm (GPU, small tier) — the unified Vulkan llama.cpp backend, standalone.
#
# One GPU-offloaded llama.cpp (Vulkan) runtime + the aimee-llm gateway, serving
# embeddings (/embed, /embed_batch), reranking (/rerank), and synthesis
# (/v1/chat/completions) from baked-in GGUFs. No external infrastructure and no
# tiered volume — the models are baked into the image.
#
# SMALL tier: Qwen3-Embedding-4B (2560-dim) + ettin-reranker-400m +
# Gemma-4-12B (dense, qat-UD-Q4_K_XL, FA+K8V4). Fits a ~16GB+ GPU fully resident.
# For the larger MoE synth on a 24GB card, install aimee-llm-gpu-mid instead.
#
# GPU: passed through with the built-in `gpu-amd` profile (the same one Wolf/Steam
# use) — the host /dev/dri render path, render-node-number-agnostic. Verified on an
# AMD 7900 XTX (RADV GFX1100). For NVIDIA/Intel, swap the profile to the matching
# built-in vendor profile.
#
# Wiring: publishes its gateway on the HOST at :8742 (hostExpose). Point the
# aimee-kb plugin's AIMEE_EMBEDDER_URL / LLM_ENDPOINT at http://10.100.0.1:8742
# (the runtime bridge gateway). Runs auth-off by default — the aimee-kb embed path
# sends no bearer, so leave AIMEE_LLM_AUTH_TOKEN blank when this backs a kb.
#
# Image: ghcr.io/rakuensoftware/aimee-kb-gpu-small
apiVersion: smoothnas.io/v1
kind: Plugin
metadata:
  name: aimee-llm-gpu-small
  version: 0.2.5
  description: >-
    aimee-llm (GPU, small tier) — unified Vulkan llama.cpp: embeddings, reranking,
    and Gemma-4-12B synthesis from baked-in GGUFs. Standalone; back the aimee-kb
    plugin's embedder/LLM endpoint with it. Fits a ~16GB+ GPU fully resident.
  vendor: RakuenSoftware
  homepage: https://github.com/RakuenSoftware/aimee
profiles:
  # Baseline container limits.
  - default-limits
  # GPU passthrough via the built-in AMD profile (host /dev/dri render path,
  # render-node-number-agnostic; no tierd restart, no custom operator profile).
  - gpu-amd
services:
  - name: llm
    artifact:
      type: oci-image
      # SMALL synth tier (Gemma-4-12B dense). embed+rerank are identical across
      # the GPU tiers, so switching to aimee-llm-gpu-mid is an image swap with no
      # KB re-embed. Versioned + :latest publishing is owned by the aimee repo's
      # release CI.
      image: ghcr.io/rakuensoftware/aimee-kb-gpu-small:latest
    container:
      restartPolicy: unless-stopped
    env:
      # Offload all layers to the GPU. The CPU image defaults NGL to 0; this GPU
      # tier resides fully in VRAM (4B embed + ~8GB Gemma-12B).
      AIMEE_LLM_NGL: "99"
      # Gateway port. 8742 (aimee's 874x range: server 8740, kb 8741) — NOT 8080,
      # which Wolf host-publishes. A hostExpose port is published on the HOST, so
      # keep this off any port another installed plugin host-exposes.
      AIMEE_LLM_PORT: "8742"
    ports:
      # The embed/rerank/synth gateway. hostExpose so the aimee-kb plugin can reach
      # it across the runtime bridge at http://10.100.0.1:8742. Not exposed off-host.
      - name: gateway
        port: 8742
        protocol: tcp
        expose: false
        hostExpose: true
    health:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8742/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Generous: the GPU runtime loads multi-GB GGUFs before it reports healthy.
      startPeriod: 600s
    config:
      - key: AIMEE_LLM_SYNTH_CTX
        type: number
        label: Synthesis context (tokens)
        default: "131072"
        min: "4096"
        description: >-
          Context window for the synthesis model. Gemma's sliding-window KV is
          cheap; 128K fits alongside the resident synth on a 16GB+ card. Lower it
          only if the container logs a VRAM allocation failure.
      - key: AIMEE_LLM_AUTH_TOKEN
        type: string
        label: Bearer token (optional)
        default: ""
        secret: true
        description: >-
          Optional. When set, the gateway requires `Authorization: Bearer <token>`
          on every request. LEAVE BLANK when this backs aimee-kb — the kb embed
          path sends no bearer and would get 401s. Only set a token if all callers
          are bearer-capable. Provide it from the secret store at deploy time, never
          checked into git.
