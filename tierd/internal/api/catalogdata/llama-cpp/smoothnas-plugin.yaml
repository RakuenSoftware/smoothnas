# llama-cpp — plain docker-compose plugin (compose-migration). GPU/runtime access is standard
# compose devices/device_cgroup_rules/cap_add; operator config is x-smoothnas.config.
# Converted from the native manifest.
name: llama-cpp
services:
  llama-cpp:
    image: ghcr.io/rakuensoftware/smoothnas-plugin-llama-cpp:0.8.1-cuda@sha256:cd5f89881e88ba012932428352e35c8b26d96059e9b05c777b0cf239d18fcf51
    restart: unless-stopped
    command:
    - --temp
    - ${LLAMA_ARG_TEMP:-0.8}
    - --n-gpu-layers
    - ${N_GPU_LAYERS:-999}
    - --ctx-size
    - ${CTX_SIZE:-32768}
    - --parallel
    - ${PARALLEL_SLOTS:-1}
    - --reasoning-format
    - ${LLAMA_ARG_REASONING_FORMAT:-auto}
    mem_limit: ${MEMORY_LIMIT:-32GiB}
    pids_limit: 1024
    oom_score_adj: 100
    environment:
      SMOOTHNAS_GPU: ${SMOOTHNAS_GPU:-}
      MODEL_URL: ${MODEL_URL:-}
      LLAMA_ARG_TEMP: ${LLAMA_ARG_TEMP:-0.8}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-999}
      CTX_SIZE: ${CTX_SIZE:-32768}
      PARALLEL_SLOTS: ${PARALLEL_SLOTS:-1}
      MEMORY_LIMIT: ${MEMORY_LIMIT:-32GiB}
      LLAMA_ARG_FLASH_ATTN: ${LLAMA_ARG_FLASH_ATTN:-on}
      LLAMA_ARG_CACHE_TYPE_K: ${LLAMA_ARG_CACHE_TYPE_K:-q8_0}
      LLAMA_ARG_CACHE_TYPE_V: ${LLAMA_ARG_CACHE_TYPE_V:-q8_0}
      LLAMA_ARG_REASONING_FORMAT: ${LLAMA_ARG_REASONING_FORMAT:-auto}
      SPECULATIVE_MODE: ${SPECULATIVE_MODE:-none}
      SPEC_DRAFT_MODEL_PATH: ${SPEC_DRAFT_MODEL_PATH:-}
      SPEC_DRAFT_MODEL_URL: ${SPEC_DRAFT_MODEL_URL:-}
      SPEC_DRAFT_BLOCK_SIZE: ${SPEC_DRAFT_BLOCK_SIZE:-3}
      SPEC_DRAFT_MAX_TOKENS: ${SPEC_DRAFT_MAX_TOKENS:-8}
      SPEC_DRAFT_N_MAX: ${SPEC_DRAFT_N_MAX:-3}
      SPEC_DRAFT_MIN_TOKENS: ${SPEC_DRAFT_MIN_TOKENS:-0}
      SPEC_DRAFT_P_MIN: ${SPEC_DRAFT_P_MIN:-0.75}
      SPEC_DRAFT_P_SPLIT: ${SPEC_DRAFT_P_SPLIT:-0.10}
      SPEC_DRAFT_CACHE_TYPE_K: ${SPEC_DRAFT_CACHE_TYPE_K:-q8_0}
      SPEC_DRAFT_CACHE_TYPE_V: ${SPEC_DRAFT_CACHE_TYPE_V:-q8_0}
      SPEC_DRAFT_GPU_LAYERS: ${SPEC_DRAFT_GPU_LAYERS:-999}
      SPEC_DRAFT_CPU_MOE_LAYERS: ${SPEC_DRAFT_CPU_MOE_LAYERS:-0}
      LLAMA_ARG_N_CPU_MOE: ${LLAMA_ARG_N_CPU_MOE:-10}
      LLAMA_ARG_FIT: ${LLAMA_ARG_FIT:-on}
      SMOOTHNAS_BEARER_EXPECTED: ${SMOOTHNAS_BEARER_EXPECTED:-}
    devices:
    - /dev/nvidiactl:/dev/nvidiactl
    - /dev/nvidia-uvm:/dev/nvidia-uvm
    - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    - /dev/nvidia0:/dev/nvidia0
    device_cgroup_rules:
    - c 195:* rwm
    - c 509:* rwm
    volumes:
    - models:/models
    expose:
    - '8080'
volumes:
  models:
    x-smoothnas:
      tier: NVME
      minSize: 50G
x-smoothnas:
  description: "llama.cpp inference server with CUDA acceleration,\nupstream llama.cpp support.\nModels\
    \ live on the NVME slot of an operator-chosen tier.\nBearer-injected auth \u2014 SmoothNAS injects\
    \ a per-plugin token via\nthe nginx route; the wrapper image validates it before forwarding\nrequests\
    \ to upstream llama-server."
  vendor: smoothnas
  homepage: https://github.com/RakuenSoftware/smoothnas-plugin-llama-cpp
  ui:
    service: llama-cpp
    port: 8080
    path: /
    auth: bearer-injected
  config:
  - key: SMOOTHNAS_GPU
    label: GPU
    type: string
    description: 'NVIDIA GPU device to pass through. Leave automatic to use the host

      default; selecting a device narrows passthrough to that GPU.

      '
    default: ''
  - key: MODEL_URL
    label: Model download URL
    type: string
    description: 'HTTP(S) URL for the GGUF model this one-model container should run.

      On start, the wrapper caches this URL under /models using the GGUF filename

      inside the container, leaving other cached GGUFs in place when the URL changes.

      '
    default: ''
  - key: LLAMA_ARG_TEMP
    label: Temperature
    type: number
    description: Sampling temperature passed to llama.cpp. Lower values are more deterministic.
    min: '0'
    max: '2'
    step: '0.01'
    default: '0.8'
  - key: N_GPU_LAYERS
    label: GPU layers
    type: number
    description: Number of model layers to offload to GPU. 999 = all (recommended for systems with enough
      VRAM).
    min: '0'
    step: '1'
    default: '999'
  - key: CTX_SIZE
    label: Context window
    type: number
    description: Total server context in tokens. Increase after confirming the selected model and GPU
      fit without exhausting host memory.
    min: '1024'
    step: '1024'
    unit: tokens
    default: '32768'
  - key: PARALLEL_SLOTS
    label: Request slots
    type: number
    description: llama.cpp parallel request slots passed to --parallel.
    min: '1'
    max: '16'
    step: '1'
    default: '1'
  - key: MEMORY_LIMIT
    label: Container memory
    type: string
    description: LXC memory limit for the llama.cpp container.
    default: 32GiB
  - key: LLAMA_ARG_FLASH_ATTN
    label: Flash attention
    type: select
    description: Enables llama.cpp flash attention.
    default: 'on'
    options:
    - value: 'on'
    - value: 'off'
  - key: LLAMA_ARG_CACHE_TYPE_K
    label: K cache type
    type: select
    description: KV cache K quantization.
    default: q8_0
    options:
    - value: q8_0
    - value: q5_0
    - value: q4_0
  - key: LLAMA_ARG_CACHE_TYPE_V
    label: V cache type
    type: select
    description: KV cache V quantization.
    default: q8_0
    options:
    - value: q8_0
    - value: q5_0
    - value: q4_0
  - key: LLAMA_ARG_REASONING_FORMAT
    label: Reasoning output format
    type: select
    description: Controls llama.cpp reasoning extraction. Use none to keep thinking in message.content
      instead of emitting message.reasoning_content.
    default: auto
    options:
    - value: auto
    - value: none
    - value: deepseek
    - value: deepseek-legacy
  - key: SPECULATIVE_MODE
    label: Speculative decoding
    type: select
    description: Enables llama.cpp speculative decoding. Use mtp for Gemma4 assistant drafting with an
      MTP head GGUF, or nextn for Qwen3.6 built-in MTP heads.
    default: none
    options:
    - value: none
    - value: mtp
    - value: draft
    - value: nextn
  - key: SPEC_DRAFT_MODEL_PATH
    label: MTP head GGUF path
    type: string
    description: Gemma4 assistant GGUF path inside the container. With SPECULATIVE_MODE=mtp this is passed
      as --mtp-head. With SPECULATIVE_MODE=nextn, set this to the cached target model path for combined
      Qwen3.6 MTP GGUFs.
    default: ''
  - key: SPEC_DRAFT_MODEL_URL
    label: MTP head download URL
    type: string
    description: Optional HTTP(S) URL for the Gemma4 assistant GGUF. When set, the wrapper downloads it
      before startup and uses it as the --mtp-head model.
    default: ''
  - key: SPEC_DRAFT_BLOCK_SIZE
    label: Draft block size
    type: number
    description: Gemma4 MTP draft block size passed to --draft-block-size.
    min: '2'
    step: '1'
    default: '3'
  - key: SPEC_DRAFT_MAX_TOKENS
    label: Draft max tokens
    type: number
    description: Maximum number of draft tokens proposed during speculative decoding.
    min: '1'
    step: '1'
    default: '8'
  - key: SPEC_DRAFT_N_MAX
    label: Built-in MTP heads
    type: number
    description: Number of Qwen NextN draft tokens passed to --draft-max.
    min: '1'
    step: '1'
    default: '3'
  - key: SPEC_DRAFT_MIN_TOKENS
    label: Draft min tokens
    type: number
    description: Minimum number of draft tokens used during speculative decoding.
    min: '0'
    step: '1'
    default: '0'
  - key: SPEC_DRAFT_P_MIN
    label: Draft probability floor
    type: number
    description: Minimum speculative decoding probability passed to --draft-p-min.
    min: '0'
    max: '1'
    step: '0.01'
    default: '0.75'
  - key: SPEC_DRAFT_P_SPLIT
    label: Draft split probability
    type: number
    description: Speculative decoding split probability for compatible non-server speculative runtimes;
      ignored by llama-server.
    min: '0'
    max: '1'
    step: '0.01'
    default: '0.10'
  - key: SPEC_DRAFT_CACHE_TYPE_K
    label: Draft K cache type
    type: select
    description: KV cache K quantization for the draft/MTP model.
    default: q8_0
    options:
    - value: q8_0
    - value: q5_0
    - value: q4_0
  - key: SPEC_DRAFT_CACHE_TYPE_V
    label: Draft V cache type
    type: select
    description: KV cache V quantization for the draft/MTP model.
    default: q8_0
    options:
    - value: q8_0
    - value: q5_0
    - value: q4_0
  - key: SPEC_DRAFT_GPU_LAYERS
    label: Draft GPU layers
    type: number
    description: Number of draft/MTP model layers to offload to GPU. 999 = all.
    min: '0'
    step: '1'
    default: '999'
  - key: SPEC_DRAFT_CPU_MOE_LAYERS
    label: Draft CPU MoE layers
    type: number
    description: Number of draft model MoE layers left on CPU/system RAM.
    min: '0'
    step: '1'
    default: '0'
  - key: LLAMA_ARG_N_CPU_MOE
    label: CPU MoE layers
    type: number
    description: Number of MoE layers left on CPU/system RAM so active experts can fit VRAM.
    min: '0'
    step: '1'
    default: '10'
  - key: LLAMA_ARG_FIT
    label: Fit model to VRAM
    type: select
    description: Let llama.cpp reduce unset GPU/context parameters to fit VRAM.
    default: 'on'
    options:
    - value: 'on'
    - value: 'off'
  - key: SMOOTHNAS_BEARER_EXPECTED
    type: string
    description: "Auto-populated by SmoothNAS to match the rotated bearer token.\nDo not edit manually\
      \ \u2014 tierd's \"rotate token\" flow keeps this\nin sync. The wrapper checks every request's\n\
      Authorization header against this value.\n"
    secret: true
