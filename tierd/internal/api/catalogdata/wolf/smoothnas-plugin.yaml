# SmoothNAS plugin manifest for Games-on-Whales Wolf (NVIDIA variant).
#
# This is the default variant because NVIDIA hosts need the most
# explicit profile selection. For AMD or Intel hosts, use the sibling
# manifests:
#   smoothnas-plugin-amd.yaml
#   smoothnas-plugin-intel.yaml

apiVersion: smoothnas.io/v1
kind: Plugin

metadata:
  name: wolf
  version: 0.3.0 # x-release-please-version
  description: |
    Games-on-Whales Wolf game streaming host for Moonlight clients.
    Wolf stores its config, TLS material, paired clients, profile
    data, and app state on a tier-bound SSD volume, and launches
    per-session application containers through the SmoothNAS runtime.
  vendor: smoothnas
  homepage: https://github.com/RakuenSoftware/smoothnas-plugin-wolf

profiles:
  - wolf-runtime
  - gpu-nvidia
  - default-limits

services:
  - name: wolf
    artifact:
      type: oci-image
      image: ghcr.io/rakuensoftware/smoothnas-plugin-wolf:0.3.0@sha256:3e6f4b0ee48c005cc7ed56bd71664a5ba3e719fbcb1597a7124852ecdde0e3a0 # x-release-please-version
      # digest filled in by .github/workflows/release.yml at publish time.

    container:
      command: []
      restartPolicy: unless-stopped
      resources:
        memory: "${MEMORY_LIMIT}"

    volumes:
      - name: state
        mode: tier-bound
        minSize: 100G
        bind: /etc/wolf
      - name: runtime
        mode: flat
        bind: /var/lib/smoothnas/plugins/wolf/runtime

    ports:
      - name: wolf-den
        port: 8080
        protocol: tcp
        expose: false
        hostExpose: true
      - name: https
        port: 47984
        protocol: tcp
        expose: false
        hostExpose: true
      - name: http
        port: 47989
        protocol: tcp
        expose: false
        hostExpose: true
      - name: control
        port: 47999
        protocol: udp
        expose: false
        hostExpose: true
      - name: rtsp
        port: 48010
        protocol: tcp
        expose: false
        hostExpose: true
      - name: video
        port: 48100
        protocol: udp
        expose: false
        hostExpose: true
      - name: audio
        port: 48200
        protocol: udp
        expose: false
        hostExpose: true

    config:
      - key: SMOOTHNAS_GPU
        type: gpu
        label: GPU
        gpuVendor: nvidia
        default: ''
        description: |
          NVIDIA GPU device to pass through. Leave automatic to use the host
          default; selecting a device narrows passthrough to that GPU.
      - key: MEMORY_LIMIT
        type: string
        label: Container memory
        default: 8GiB
        description: LXC memory limit for the Wolf control container.
      - key: WOLF_LOG_LEVEL
        type: select
        label: Log level
        default: INFO
        options:
          - value: ERROR
          - value: WARNING
          - value: INFO
          - value: DEBUG
          - value: TRACE
        description: Wolf server log verbosity.
      - key: WOLF_IMAGE_TAG
        type: string
        label: Image tag
        default: fedora-43
        description: Tag used for Games-on-Whales app images and the default PulseAudio helper image.
      - key: WOLF_RENDER_NODE
        type: string
        label: Render node
        default: /dev/dri/renderD128
        description: DRM render node Wolf uses for virtual desktops and vendor detection.
      - key: WOLF_ENCODER_NODE
        type: string
        label: Encoder node
        default: ''
        description: DRM render node GStreamer uses for encoding; leave empty to use the render node.
      - key: WOLF_PULSE_IMAGE
        type: string
        label: PulseAudio image
        default: ''
        description: Full PulseAudio helper image override; leave empty to use ghcr.io/games-on-whales/pulseaudio:${WOLF_IMAGE_TAG}.
      - key: WOLF_STOP_CONTAINER_ON_EXIT
        type: select
        label: Stop apps on disconnect
        default: "TRUE"
        options:
          - value: "TRUE"
          - value: "FALSE"
        description: When TRUE, Wolf stops and removes app containers when a stream ends.
      - key: WOLF_USE_ZERO_COPY
        type: select
        label: Zero-copy video
        default: "TRUE"
        options:
          - value: "TRUE"
          - value: "FALSE"
        description: Enables Wolf's zero-copy GStreamer path.
      - key: NVIDIA_VISIBLE_DEVICES
        type: string
        label: NVIDIA devices
        default: all
        description: NVIDIA device selector passed through to Wolf-launched app containers.
      - key: NVIDIA_DRIVER_CAPABILITIES
        type: string
        label: NVIDIA capabilities
        default: all
        description: NVIDIA driver capability selector passed through to Wolf-launched app containers.
      - key: XDG_RUNTIME_DIR
        type: string
        label: Runtime dir
        default: /var/lib/smoothnas/plugins/wolf/runtime
        description: |
          Wolf XDG runtime dir. Must equal the host path of the 'runtime' volume
          so the sockets Wolf bind-mounts into sibling containers (PulseAudio and
          app containers) resolve on the host. Wolf can't introspect its own
          container under the SmoothNAS LXC runtime, so it uses this path verbatim
          as the sibling-mount source; identity-mapping it is what makes that work.
