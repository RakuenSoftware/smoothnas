# wolf — plain docker-compose plugin (compose-migration). GPU/runtime access is standard
# compose devices/device_cgroup_rules/cap_add; operator config is x-smoothnas.config.
# Converted from the native manifest.
name: wolf
services:
  wolf:
    image: ghcr.io/rakuensoftware/smoothnas-plugin-wolf:0.3.0@sha256:3e6f4b0ee48c005cc7ed56bd71664a5ba3e719fbcb1597a7124852ecdde0e3a0
    restart: unless-stopped
    mem_limit: ${MEMORY_LIMIT:-8GiB}
    pids_limit: 1024
    oom_score_adj: 100
    environment:
      MEMORY_LIMIT: ${MEMORY_LIMIT:-8GiB}
      WOLF_LOG_LEVEL: ${WOLF_LOG_LEVEL:-INFO}
      WOLF_IMAGE_TAG: ${WOLF_IMAGE_TAG:-fedora-43}
      WOLF_RENDER_NODE: ${WOLF_RENDER_NODE:-}
      WOLF_ENCODER_NODE: ${WOLF_ENCODER_NODE:-}
      WOLF_PULSE_IMAGE: ${WOLF_PULSE_IMAGE:-}
      WOLF_STOP_CONTAINER_ON_EXIT: ${WOLF_STOP_CONTAINER_ON_EXIT:-TRUE}
      WOLF_USE_ZERO_COPY: ${WOLF_USE_ZERO_COPY:-TRUE}
      XDG_RUNTIME_DIR: /run/user/wolf
      HOST_APPS_STATE_FOLDER: /etc/wolf
      WOLF_DOCKER_SOCKET: /run/smoothnas-runtime/docker.sock
    devices:
    - /dev/uinput:/dev/uinput
    - /dev/uhid:/dev/uhid
    - /dev/input:/dev/input
    - /dev/dri:/dev/dri
    device_cgroup_rules:
    - c 10:223 rwm
    - c 10:239 rwm
    - c 13:* rwm
    - c 244:* rwm
    - c 226:* rwm
    cap_add:
    - NET_RAW
    - MKNOD
    - NET_ADMIN
    - SYS_ADMIN
    - SYS_NICE
    volumes:
    - state:/etc/wolf
    - runtime:/var/lib/smoothnas/plugins/wolf/runtime
    - /run/smoothnas-runtime:/run/smoothnas-runtime
    - /run/udev:/run/udev
    ports:
    - 8080:8080
    - 47984:47984
    - 47989:47989
    - 47999:47999/udp
    - 48010:48010
    - 48100:48100/udp
    - 48200:48200/udp
volumes:
  state:
    x-smoothnas:
      tier: SSD
      minSize: 100G
  runtime: {}
x-smoothnas:
  description: 'Games-on-Whales Wolf game streaming host for Moonlight clients

    with Intel GPU access through /dev/dri.'
  vendor: smoothnas
  homepage: https://github.com/RakuenSoftware/smoothnas-plugin-wolf
  config:
  - key: MEMORY_LIMIT
    label: Container memory
    type: string
    description: LXC memory limit for the Wolf control container.
    default: 8GiB
  - key: WOLF_LOG_LEVEL
    label: Log level
    type: select
    description: Wolf server log verbosity.
    default: INFO
    options:
    - value: ERROR
    - value: WARNING
    - value: INFO
    - value: DEBUG
    - value: TRACE
  - key: WOLF_IMAGE_TAG
    label: Image tag
    type: string
    description: Tag used for Games-on-Whales app images and the default PulseAudio helper image.
    default: fedora-43
  - key: WOLF_RENDER_NODE
    label: GPU
    type: string
    description: DRM render node Wolf uses for virtual desktops, vendor detection, and encoding.
    default: ''
  - key: WOLF_ENCODER_NODE
    label: Encoder node
    type: string
    description: DRM render node GStreamer uses for encoding; leave empty to use the render node.
    default: ''
  - key: WOLF_PULSE_IMAGE
    label: PulseAudio image
    type: string
    description: Full PulseAudio helper image override; leave empty to use ghcr.io/games-on-whales/pulseaudio:${WOLF_IMAGE_TAG}.
    default: ''
  - key: WOLF_STOP_CONTAINER_ON_EXIT
    label: Stop apps on disconnect
    type: select
    description: When TRUE, Wolf stops and removes app containers when a stream ends.
    default: 'TRUE'
    options:
    - value: 'TRUE'
    - value: 'FALSE'
  - key: WOLF_USE_ZERO_COPY
    label: Zero-copy video
    type: select
    description: Enables Wolf's zero-copy GStreamer path.
    default: 'TRUE'
    options:
    - value: 'TRUE'
    - value: 'FALSE'
  - key: XDG_RUNTIME_DIR
    label: Runtime dir
    type: string
    description: 'Wolf XDG runtime dir. Must equal the host path of the ''runtime'' volume

      so the sockets Wolf bind-mounts into sibling containers (PulseAudio and

      app containers) resolve on the host. Wolf can''t introspect its own

      container under the SmoothNAS LXC runtime, so it uses this path verbatim

      as the sibling-mount source; identity-mapping it is what makes that work.

      '
    default: /var/lib/smoothnas/plugins/wolf/runtime
