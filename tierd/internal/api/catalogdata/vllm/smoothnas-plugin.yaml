# vllm — plain docker-compose plugin (compose-migration). GPU/runtime access is standard
# compose devices/device_cgroup_rules/cap_add; operator config is x-smoothnas.config.
# Converted from the native manifest.
name: vllm
services:
  vllm:
    image: ghcr.io/rakuensoftware/smoothnas-plugin-vllm:0.2.5-cuda@sha256:f6f3cfbc532a4c35f29dd92f3c7e508f79c47509fb8855da40c1b69aa0e15a88
    restart: unless-stopped
    mem_limit: ${MEMORY_LIMIT:-16GiB}
    pids_limit: 1024
    oom_score_adj: 100
    environment:
      SMOOTHNAS_GPU: ${SMOOTHNAS_GPU:-}
      MODEL_ID: ${MODEL_ID:-unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q5_K_XL}
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_TOKENIZER: ${VLLM_TOKENIZER:-google/gemma-4-26B-A4B-it}
      VLLM_HF_CONFIG_PATH: ${VLLM_HF_CONFIG_PATH:-google/gemma-4-26B-A4B-it}
      VLLM_LOAD_FORMAT: ${VLLM_LOAD_FORMAT:-gguf}
      VLLM_SERVED_MODEL_NAME: ${VLLM_SERVED_MODEL_NAME:-gemma4-q5-26b}
      VLLM_TENSOR_PARALLEL_SIZE: ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      VLLM_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-65536}
      VLLM_MAX_NUM_SEQS: ${VLLM_MAX_NUM_SEQS:-4}
      VLLM_MAX_NUM_BATCHED_TOKENS: ${VLLM_MAX_NUM_BATCHED_TOKENS:-262144}
      VLLM_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.92}
      VLLM_KV_CACHE_DTYPE: ${VLLM_KV_CACHE_DTYPE:-turboquant_k8v4}
      VLLM_KV_CACHE_MEMORY_BYTES: ${VLLM_KV_CACHE_MEMORY_BYTES:-}
      VLLM_CPU_OFFLOAD_GB: ${VLLM_CPU_OFFLOAD_GB:-}
      VLLM_SPECULATIVE_CONFIG: ${VLLM_SPECULATIVE_CONFIG:-{"method":"mtp","model":"google/gemma-4-26B-A4B-it-assistant","num_speculative_tokens":4}}
      VLLM_TOOL_CALL_PARSER: ${VLLM_TOOL_CALL_PARSER:-}
      VLLM_REASONING_PARSER: ${VLLM_REASONING_PARSER:-}
      VLLM_ENABLE_AUTO_TOOL_CHOICE: ${VLLM_ENABLE_AUTO_TOOL_CHOICE:-off}
      VLLM_CHAT_TEMPLATE: ${VLLM_CHAT_TEMPLATE:-}
      VLLM_LIMIT_MM_PER_PROMPT: ${VLLM_LIMIT_MM_PER_PROMPT:-}
      VLLM_ENABLE_PREFIX_CACHING: ${VLLM_ENABLE_PREFIX_CACHING:-on}
      VLLM_ENABLE_CHUNKED_PREFILL: ${VLLM_ENABLE_CHUNKED_PREFILL:-auto}
      VLLM_ASYNC_SCHEDULING: ${VLLM_ASYNC_SCHEDULING:-off}
      VLLM_DTYPE: ${VLLM_DTYPE:-float16}
      VLLM_QUANTIZATION: ${VLLM_QUANTIZATION:-none}
      VLLM_TRUST_REMOTE_CODE: ${VLLM_TRUST_REMOTE_CODE:-on}
      VLLM_ADDITIONAL_CONFIG: ${VLLM_ADDITIONAL_CONFIG:-}
      MEMORY_LIMIT: ${MEMORY_LIMIT:-16GiB}
      SMOOTHNAS_BEARER_EXPECTED: ${SMOOTHNAS_BEARER_EXPECTED:-}
    devices:
    - /dev/nvidiactl:/dev/nvidiactl
    - /dev/nvidia-uvm:/dev/nvidia-uvm
    - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    - /dev/nvidia0:/dev/nvidia0
    device_cgroup_rules:
    - c 195:* rwm
    - c 509:* rwm
    volumes:
    - huggingface-cache:/root/.cache/huggingface
    expose:
    - '8080'
volumes:
  huggingface-cache:
    x-smoothnas:
      tier: NVME
      minSize: 50G
x-smoothnas:
  description: 'vLLM OpenAI-compatible inference server using the official CUDA image for

    NVIDIA GPUs. Hugging Face cache data lives on the NVME slot of an

    operator-chosen tier. Bearer-injected auth is enforced by the SmoothNAS

    wrapper before requests reach vLLM.'
  vendor: smoothnas
  homepage: https://github.com/RakuenSoftware/smoothnas-plugin-vllm
  ui:
    service: vllm
    port: 8080
    path: /
    auth: bearer-injected
  config:
  - key: SMOOTHNAS_GPU
    label: GPU
    type: string
    description: 'NVIDIA GPU device to pass through. Leave automatic to use the host

      default; selecting a device narrows passthrough to that GPU.

      '
    default: ''
  - key: MODEL_ID
    label: Model
    type: string
    description: Hugging Face model id, local model path, or GGUF repo:quant passed to vLLM.
    default: unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q5_K_XL
  - key: HF_TOKEN
    label: Hugging Face token
    type: string
    description: Optional Hugging Face token for gated model downloads.
    secret: true
  - key: VLLM_TOKENIZER
    label: Tokenizer
    type: string
    description: Tokenizer id/path, required when MODEL_ID points at a GGUF quant.
    default: google/gemma-4-26B-A4B-it
  - key: VLLM_HF_CONFIG_PATH
    label: HF config path
    type: string
    description: Hugging Face config id/path for GGUF models.
    default: google/gemma-4-26B-A4B-it
  - key: VLLM_LOAD_FORMAT
    label: Load format
    type: select
    description: vLLM weight loader selection.
    default: gguf
    options:
    - value: auto
    - value: gguf
    - value: safetensors
    - value: bitsandbytes
  - key: VLLM_SERVED_MODEL_NAME
    label: Served model name
    type: string
    description: Optional OpenAI model name exposed by vLLM.
    default: gemma4-q5-26b
  - key: VLLM_TENSOR_PARALLEL_SIZE
    label: Tensor parallel size
    type: number
    description: Number of GPUs used for tensor parallelism.
    min: '1'
    step: '1'
    default: '1'
  - key: VLLM_MAX_MODEL_LEN
    label: Max model length
    type: number
    description: Maximum per-request context length passed to vLLM.
    min: '1024'
    step: '1024'
    unit: tokens
    default: '65536'
  - key: VLLM_MAX_NUM_SEQS
    label: Max sequences
    type: number
    description: Maximum number of concurrent 64k slots.
    min: '1'
    step: '1'
    default: '4'
  - key: VLLM_MAX_NUM_BATCHED_TOKENS
    label: Max batched tokens
    type: number
    description: Scheduler token budget for four 64k slots.
    min: '1024'
    step: '1024'
    unit: tokens
    default: '262144'
  - key: VLLM_GPU_MEMORY_UTILIZATION
    label: GPU memory utilization
    type: number
    description: Fraction of GPU memory vLLM may reserve.
    min: '0.10'
    max: '1'
    step: '0.01'
    default: '0.92'
  - key: VLLM_KV_CACHE_DTYPE
    label: KV cache dtype
    type: select
    description: vLLM KV cache storage type. turboquant_k8v4 is the TurboQuant K8/V4 preset.
    default: turboquant_k8v4
    options:
    - value: auto
    - value: fp8
    - value: fp8_e4m3
    - value: fp8_e5m2
    - value: int8_per_token_head
    - value: turboquant_k8v4
  - key: VLLM_KV_CACHE_MEMORY_BYTES
    label: KV cache memory
    type: string
    description: Optional fixed KV cache size accepted by vLLM, such as 20G.
    default: ''
  - key: VLLM_CPU_OFFLOAD_GB
    label: CPU offload GiB
    type: number
    description: Optional CPU offload budget for fitting larger checkpoints.
    min: '0'
    step: '1'
    default: ''
  - key: VLLM_SPECULATIVE_CONFIG
    label: Speculative config
    type: string
    description: JSON passed to --speculative-config for Gemma4 MTP.
    default: '{"method":"mtp","model":"google/gemma-4-26B-A4B-it-assistant","num_speculative_tokens":4}'
  - key: VLLM_TOOL_CALL_PARSER
    label: Tool call parser
    type: string
    description: Optional parser passed to --tool-call-parser, such as gemma4.
    default: ''
  - key: VLLM_REASONING_PARSER
    label: Reasoning parser
    type: string
    description: Optional parser passed to --reasoning-parser, such as gemma4.
    default: ''
  - key: VLLM_ENABLE_AUTO_TOOL_CHOICE
    label: Auto tool choice
    type: select
    description: Enable vLLM automatic tool-call detection when a tool parser is configured.
    default: 'off'
    options:
    - value: 'off'
    - value: 'on'
  - key: VLLM_CHAT_TEMPLATE
    label: Chat template
    type: string
    description: Optional chat template path passed to --chat-template.
    default: ''
  - key: VLLM_LIMIT_MM_PER_PROMPT
    label: Multimodal limits
    type: string
    description: Optional JSON passed to --limit-mm-per-prompt, such as {"image":0,"audio":0}.
    default: ''
  - key: VLLM_ENABLE_PREFIX_CACHING
    label: Prefix caching
    type: select
    description: Optional vLLM prefix cache toggle.
    default: 'on'
    options:
    - value: auto
    - value: 'off'
    - value: 'on'
  - key: VLLM_ENABLE_CHUNKED_PREFILL
    label: Chunked prefill
    type: select
    description: Optional vLLM chunked prefill toggle.
    default: auto
    options:
    - value: auto
    - value: 'off'
    - value: 'on'
  - key: VLLM_ASYNC_SCHEDULING
    label: Async scheduling
    type: select
    description: Enable --async-scheduling for higher-throughput vLLM scheduling.
    default: 'off'
    options:
    - value: 'off'
    - value: 'on'
  - key: VLLM_DTYPE
    label: Dtype
    type: select
    description: vLLM dtype selection.
    default: float16
    options:
    - value: auto
    - value: float16
    - value: bfloat16
  - key: VLLM_QUANTIZATION
    label: Quantization
    type: select
    description: Optional vLLM quantization mode.
    default: none
    options:
    - value: none
    - value: fp8
    - value: awq
    - value: gptq
  - key: VLLM_TRUST_REMOTE_CODE
    label: Trust remote code
    type: select
    description: Enable only for model repos whose custom code you trust.
    default: 'on'
    options:
    - value: 'off'
    - value: 'on'
  - key: VLLM_ADDITIONAL_CONFIG
    label: Additional config
    type: string
    description: Optional raw JSON passed to --additional-config.
    default: ''
  - key: MEMORY_LIMIT
    label: Container memory
    type: string
    description: LXC memory limit for the vLLM container.
    default: 16GiB
  - key: SMOOTHNAS_BEARER_EXPECTED
    type: string
    description: 'Auto-populated by SmoothNAS to match the rotated bearer token.

      Do not edit manually; the wrapper validates every request against it.

      '
    secret: true
