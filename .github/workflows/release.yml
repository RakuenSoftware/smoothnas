name: Release

on:
  push:
    branches: [testing, main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0). Leave blank for auto-generated version.'
        required: false
        type: string
      bump:
        description: 'Version bump type for main (ignored if version is set).'
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: read
  actions: read

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      smoothkernel_tag: ${{ steps.smoothkernel.outputs.tag }}
      smoothfs_ref: ${{ steps.smoothfs_ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require SmoothFS protocol gate on stable releases
        if: github.ref_name == 'main' && vars.SMOOTHNAS_PROTOCOL_GATE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion=""
          for _ in $(seq 1 120); do
            conclusion="$(gh run list \
              --workflow smoothfs-protocol-gate.yml \
              --commit "$GITHUB_SHA" \
              --status completed \
              --json conclusion \
              --jq '.[0].conclusion // ""')"
            [ -n "$conclusion" ] && break
            sleep 60
          done
          if [ "$conclusion" != "success" ]; then
            echo "smoothfs-protocol-gate.yml must pass on $GITHUB_SHA before a stable release. Last conclusion: ${conclusion:-none}" >&2
            exit 1
          fi

      - name: Determine version and channel
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          next_stable_version() {
            local latest_tag version major minor patch bump
            bump="${1:-patch}"

            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
            if [ -z "${latest_tag}" ]; then
              echo "0.0.1"
              return
            fi

            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "${version}"
            case "${bump}" in
              major) major="$((major + 1))"; minor=0; patch=0 ;;
              minor) minor="$((minor + 1))"; patch=0 ;;
              *)     patch="$((patch + 1))" ;;
            esac
            echo "${major}.${minor}.${patch}"
          }

          if [ "${{ github.ref_name }}" = "main" ]; then
            if [ -n "${{ inputs.version }}" ]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION="$(next_stable_version "${{ inputs.bump }}")"
            fi

            if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable releases on main must use X.Y.Z; got ${VERSION}" >&2
              exit 1
            fi

            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "name=SmoothNAS v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(date -u +%Y.%m%d.%H%M)-$(git rev-parse --short HEAD)"
            if [ -n "${{ inputs.version }}" ]; then
              VERSION="${{ inputs.version }}"
            fi
            echo "channel=testing" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tag=testing-${VERSION}" >> "$GITHUB_OUTPUT"
            echo "name=SmoothNAS v${VERSION} (testing)" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Read pinned SmoothKernel release tag
        id: smoothkernel
        run: |
          set -euo pipefail
          TAG="$(head -n 1 iso/smoothkernel-version | tr -d '[:space:]')"
          [ -n "$TAG" ] || { echo "iso/smoothkernel-version is empty" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Pinned to SmoothKernel release: $TAG"

      - name: Read pinned smoothfs ref
        id: smoothfs_ref
        run: |
          set -euo pipefail
          REF="$(grep '^SMOOTHFS_REPO_REF=' iso/build-iso.sh | grep -oE '[0-9a-f]{40}' | head -n1)"
          [ -n "$REF" ] || { echo "Could not extract SMOOTHFS_REPO_REF from iso/build-iso.sh" >&2; exit 1; }
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Pinned to smoothfs ref: $REF"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            runner: [self-hosted, smoothnas]
          - deb_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # isolinux + syslinux-utils are BIOS-only x86 tools and are not
          # in the arm64 archive; only the amd64 leg needs them.
          bios_pkgs=""
          if [ "${{ matrix.deb_arch }}" = "amd64" ]; then
            bios_pkgs="isolinux syslinux-utils"
          fi
          sudo apt-get install -y \
            xorriso $bios_pkgs cpio gzip file curl \
            gh jq libpam0g-dev build-essential dpkg-dev xz-utils ripgrep \
            pkg-config lxc-dev

          compiler_smoke() {
            local out
            out="$(mktemp "${RUNNER_TEMP:-/tmp}/smoothnas-cc-check.XXXXXX")"
            rm -f "$out"
            printf '%s\n' 'int main(void) { return 0; }' | gcc -x c - -o "$out"
            rm -f "$out"
          }

          if ! compiler_smoke; then
            echo "::warning::gcc smoke test failed; reinstalling compiler toolchain"
            cc1_path="$(gcc -print-file-name=cc1 2>/dev/null || true)"
            cc1_pkgs=""
            if [ -n "$cc1_path" ] && [ -e "$cc1_path" ]; then
              cc1_pkgs="$(dpkg-query -S "$cc1_path" 2>/dev/null | cut -d: -f1 | sort -u | xargs echo || true)"
            fi
            sudo apt-get install --reinstall -y gcc cpp build-essential $cc1_pkgs
            compiler_smoke
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::gh not found after dependency install; reinstalling gh"
            sudo apt-get install --reinstall -y gh
          fi
          command -v gh
          gh --version

      - name: Stabilize self-hosted DNS
        if: ${{ contains(matrix.runner, 'self-hosted') }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t current_nameservers < <(awk '$1 == "nameserver" { print $2 }' /etc/resolv.conf 2>/dev/null || true)
          tmp_resolv="$(mktemp)"
          seen=""
          for ns in "${current_nameservers[@]}" 192.168.1.254 192.168.1.1 1.1.1.1 8.8.8.8; do
            [ -n "$ns" ] || continue
            case " $seen " in
              *" $ns "*) continue ;;
            esac
            printf 'nameserver %s\n' "$ns" >> "$tmp_resolv"
            seen="${seen} ${ns}"
          done
          printf 'options timeout:2 attempts:1 rotate\n' >> "$tmp_resolv"
          cat "$tmp_resolv" > /etc/resolv.conf
          rm -f "$tmp_resolv"
          if ! grep -q '^precedence ::ffff:0:0/96  100' /etc/gai.conf 2>/dev/null; then
            printf '\nprecedence ::ffff:0:0/96  100\n' >> /etc/gai.conf
          fi
          for host in api.github.com codeload.github.com nodejs.org registry.npmjs.org go.dev results-receiver.actions.githubusercontent.com; do
            if timeout 8 getent ahostsv4 "$host" >/dev/null; then
              echo "Resolved ${host} over IPv4"
            else
              echo "::warning::Could not resolve ${host} over IPv4 during DNS preflight"
            fi
          done

      - name: Set up Go on self-hosted Linux
        if: ${{ contains(matrix.runner, 'self-hosted') }}
        shell: bash
        run: |
          set -euo pipefail
          go_version="$(awk '$1 == "go" { print $2; exit }' tierd/go.mod)"
          if [ -z "$go_version" ]; then
            echo "Could not determine Go version from tierd/go.mod" >&2
            exit 1
          fi
          case "$(uname -m)" in
            x86_64) go_arch="amd64" ;;
            aarch64|arm64) go_arch="arm64" ;;
            *) echo "Unsupported Go architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="/tmp/go-${go_version}.linux-${go_arch}.tar.gz"
          go_root="/tmp/smoothnas-go-${go_version}"
          rm -rf "$go_root"
          curl -fsSL "https://go.dev/dl/go${go_version}.linux-${go_arch}.tar.gz" -o "$archive"
          mkdir -p "$go_root"
          tar -C "$go_root" --strip-components=1 -xzf "$archive"
          "$go_root/bin/go" version
          go_path="${RUNNER_TEMP:-/tmp}/smoothnas-go-path"
          go_mod_cache="$go_path/pkg/mod"
          go_build_cache="${RUNNER_TEMP:-/tmp}/smoothnas-go-build-cache"
          mkdir -p "$go_mod_cache" "$go_build_cache" "$go_path/bin"
          {
            echo "GOROOT=$go_root"
            echo "GOPATH=$go_path"
            echo "GOMODCACHE=$go_mod_cache"
            echo "GOCACHE=$go_build_cache"
          } >> "$GITHUB_ENV"
          echo "$go_root/bin" >> "$GITHUB_PATH"
          echo "$go_path/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-go@v6
        if: ${{ contains(matrix.runner, 'self-hosted') == false }}
        with:
          go-version-file: tierd/go.mod

      - name: Set up Node on self-hosted Linux
        if: ${{ contains(matrix.runner, 'self-hosted') }}
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) node_arch="x64" ;;
            aarch64|arm64) node_arch="arm64" ;;
            *) echo "Unsupported Node architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          base_url="https://nodejs.org/dist/latest-v22.x"
          work_dir="$(mktemp -d)"
          node_root="${RUNNER_TEMP:-/tmp}/smoothnas-node-22"
          trap 'rm -rf "$work_dir"' EXIT
          curl -fsSL --connect-timeout 10 --retry 5 --retry-delay 3 \
            "$base_url/SHASUMS256.txt" -o "$work_dir/SHASUMS256.txt"
          archive="$(awk -v arch="$node_arch" '$2 ~ "linux-" arch "[.]tar[.]xz$" { print $2; exit }' "$work_dir/SHASUMS256.txt")"
          [ -n "$archive" ] || { echo "Could not find Node linux-${node_arch} archive" >&2; exit 1; }
          curl -fsSL --connect-timeout 10 --retry 5 --retry-delay 3 \
            "$base_url/$archive" -o "$work_dir/$archive"
          (cd "$work_dir" && grep " $archive$" SHASUMS256.txt | sha256sum -c -)
          rm -rf "$node_root"
          mkdir -p "$node_root"
          tar -C "$node_root" --strip-components=1 -xJf "$work_dir/$archive"
          export PATH="$node_root/bin:$PATH"
          echo "$node_root/bin" >> "$GITHUB_PATH"
          node --version
          npm --version

      - uses: actions/setup-node@v6
        if: ${{ contains(matrix.runner, 'self-hosted') == false }}
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tierd-ui/package-lock.json

      - name: Build tierd backend
        working-directory: tierd
        env:
          # github.com/msteinert/pam/v2 probes RTLD_NEXT via cgo; on
          # some self-hosted libc header combinations that symbol is
          # only exposed when GNU extensions are explicitly enabled.
          CGO_CFLAGS: "-O2 -g -D_GNU_SOURCE"
        run: CGO_ENABLED=1 go build -ldflags "-X main.version=${{ needs.meta.outputs.version }}" -o ../bin/tierd ./cmd/tierd/

      - name: Build tierd-ui frontend
        working-directory: tierd-ui
        run: |
          echo '//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}' >> .npmrc
          npm ci && npm run build

      - name: Build SmoothNAS runtime
        timeout-minutes: 10
        run: ./scripts/build-smoothnas-runtime.sh

      - name: Download SmoothKernel + ZFS .debs
        run: |
          set -euo pipefail
          release_api="https://api.github.com/repos/RakuenSoftware/smoothkernel/releases/tags/${{ needs.meta.outputs.smoothkernel_tag }}"
          for attempt in 1 2 3; do
            rm -rf deps/smoothkernel-out
            mkdir -p deps/smoothkernel-out
            if timeout 240s bash -c '
              set -euo pipefail
              curl -fsSL --connect-timeout 10 --retry 5 --retry-delay 3 "$1" -o "$2/release.json"
              jq -er ".assets[] | select(.name == \"SHA256SUMS\" or (.name | endswith(\".deb\"))) | [.name, .browser_download_url] | @tsv" "$2/release.json" |
                while IFS=$'\''\t'\'' read -r name url; do
                  curl -fL --connect-timeout 10 --retry 5 --retry-delay 3 "$url" -o "$2/$name"
                done
              test -s "$2/SHA256SUMS"
            ' _ "$release_api" deps/smoothkernel-out \
              && (cd deps/smoothkernel-out && sha256sum -c SHA256SUMS); then
              break
            fi
            echo "::warning::SmoothKernel download attempt ${attempt} failed"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
          ls -lh deps/smoothkernel-out/

      - name: Checkout smoothiso
        uses: actions/checkout@v6
        with:
          repository: RakuenSoftware/smoothiso
          path: deps/smoothiso

      - name: Build ISO
        env:
          SMOOTHISO_DIR: ${{ github.workspace }}/deps/smoothiso
          SMOOTHKERNEL_DIR: ${{ github.workspace }}/deps/smoothkernel-out
          ZFS_ARTIFACT_DIR: ${{ github.workspace }}/deps/smoothkernel-out
          SMOOTHFS_REPO_URL: https://github.com/RakuenSoftware/smoothfs.git
          DEB_ARCH: ${{ matrix.deb_arch }}
          # Installer UI is whiptail; no browser is bundled or used.
          INSTALLER_BROWSER_DEFERRED: '1'
        run: |
          chmod +x iso/build-iso.sh
          ./iso/build-iso.sh ${{ needs.meta.outputs.version }}

      - name: Stage per-arch release artifacts
        run: |
          set -euo pipefail
          mkdir -p stage
          cp "iso/output/smoothnas-${{ needs.meta.outputs.version }}-${{ matrix.deb_arch }}.iso" \
             "stage/smoothnas-${{ needs.meta.outputs.version }}-${{ matrix.deb_arch }}.iso"
          cp bin/tierd "stage/tierd-${{ matrix.deb_arch }}"
          cp bin/docker-lxc-daemon "stage/smoothnas-runtime-${{ matrix.deb_arch }}"
          # Arch-independent assets are staged from amd64 only so the release
          # job has exactly one copy of each to upload.
          if [ "${{ matrix.deb_arch }}" = "amd64" ]; then
            mkdir -p dist
            tar -czf dist/tierd-ui.tar.gz -C tierd-ui/dist/smoothnas-ui .
            cp dist/tierd-ui.tar.gz stage/tierd-ui.tar.gz
            # Package the smoothfs DKMS source (src/smoothfs/ contents) so the
            # in-product updater can rebuild the kernel module on installed systems.
            tar -czf stage/smoothfs-src.tar.gz -C iso/cache/smoothfs-src/src/smoothfs .
          fi
          ls -lh stage/

      - name: Upload per-arch artifact
        uses: actions/upload-artifact@v7
        with:
          name: smoothnas-${{ matrix.deb_arch }}
          path: stage
          if-no-files-found: error

  release:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download per-arch artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-input

      - name: Merge release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            src="release-input/smoothnas-${arch}"
            test -d "$src" || { echo "missing artifact for $arch" >&2; exit 1; }
            for f in "$src"/*; do
              name="$(basename "$f")"
              if [ -e "dist/$name" ]; then
                # tierd-ui.tar.gz is staged on amd64 only, but be defensive.
                continue
              fi
              cp "$f" "dist/$name"
            done
          done

          TIERD_AMD64_SHA=$(sha256sum dist/tierd-amd64 | awk '{print $1}')
          TIERD_ARM64_SHA=$(sha256sum dist/tierd-arm64 | awk '{print $1}')
          RUNTIME_AMD64_SHA=$(sha256sum dist/smoothnas-runtime-amd64 | awk '{print $1}')
          RUNTIME_ARM64_SHA=$(sha256sum dist/smoothnas-runtime-arm64 | awk '{print $1}')
          UI_SHA=$(sha256sum dist/tierd-ui.tar.gz | awk '{print $1}')
          SMOOTHFS_SRC_SHA=$(sha256sum dist/smoothfs-src.tar.gz | awk '{print $1}')
          cat > dist/manifest.json <<EOFM
          {
            "version": "${{ needs.meta.outputs.version }}",
            "channel": "${{ needs.meta.outputs.channel }}",
            "tierd_amd64_sha256": "${TIERD_AMD64_SHA}",
            "tierd_arm64_sha256": "${TIERD_ARM64_SHA}",
            "runtime_amd64_sha256": "${RUNTIME_AMD64_SHA}",
            "runtime_arm64_sha256": "${RUNTIME_ARM64_SHA}",
            "ui_sha256": "${UI_SHA}",
            "smoothfs_ref": "${{ needs.meta.outputs.smoothfs_ref }}",
            "smoothfs_src_sha256": "${SMOOTHFS_SRC_SHA}"
          }
          EOFM
          ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ needs.meta.outputs.name }}
          RELEASE_PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail

          create_flags=(
            --title "$RELEASE_NAME"
            --target "$GITHUB_SHA"
            --generate-notes
          )
          edit_flags=(
            --title "$RELEASE_NAME"
            --target "$GITHUB_SHA"
            --draft=false
          )
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            create_flags+=(--prerelease)
            edit_flags+=(--prerelease)
          else
            edit_flags+=(--prerelease=false)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${edit_flags[@]}"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${create_flags[@]}"
          fi

          upload_asset() {
            local asset="$1"
            local attempt delay
            for attempt in 1 2 3 4 5; do
              if gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber; then
                return 0
              fi
              delay=$((attempt * 20))
              echo "Upload failed for ${asset}; retrying in ${delay}s (${attempt}/5)" >&2
              sleep "$delay"
            done
            echo "Failed to upload ${asset} after 5 attempts" >&2
            return 1
          }

          assets=(
            "dist/smoothnas-${RELEASE_VERSION}-amd64.iso"
            "dist/smoothnas-${RELEASE_VERSION}-arm64.iso"
            "dist/tierd-amd64"
            "dist/tierd-arm64"
            "dist/smoothnas-runtime-amd64"
            "dist/smoothnas-runtime-arm64"
            "dist/tierd-ui.tar.gz"
            "dist/smoothfs-src.tar.gz"
            "dist/manifest.json"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
            upload_asset "$asset"
          done
