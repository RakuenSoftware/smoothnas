name: Release

on:
  push:
    branches: [testing, main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0). Leave blank for auto-generated version.'
        required: false
        type: string
      bump:
        description: 'Version bump type for main (ignored if version is set).'
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: read
  actions: read

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      smoothkernel_tag: ${{ steps.smoothkernel.outputs.tag }}
      smoothfs_ref: ${{ steps.smoothfs_ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require SmoothFS protocol gate on stable releases
        if: github.ref_name == 'main' && vars.SMOOTHNAS_PROTOCOL_GATE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion=""
          for _ in $(seq 1 120); do
            conclusion="$(gh run list \
              --workflow smoothfs-protocol-gate.yml \
              --commit "$GITHUB_SHA" \
              --status completed \
              --json conclusion \
              --jq '.[0].conclusion // ""')"
            [ -n "$conclusion" ] && break
            sleep 60
          done
          if [ "$conclusion" != "success" ]; then
            echo "smoothfs-protocol-gate.yml must pass on $GITHUB_SHA before a stable release. Last conclusion: ${conclusion:-none}" >&2
            exit 1
          fi

      - name: Determine version and channel
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          next_stable_version() {
            local latest_tag version major minor patch bump
            bump="${1:-patch}"

            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
            if [ -z "${latest_tag}" ]; then
              echo "0.0.1"
              return
            fi

            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "${version}"
            case "${bump}" in
              major) major="$((major + 1))"; minor=0; patch=0 ;;
              minor) minor="$((minor + 1))"; patch=0 ;;
              *)     patch="$((patch + 1))" ;;
            esac
            echo "${major}.${minor}.${patch}"
          }

          if [ "${{ github.ref_name }}" = "main" ]; then
            if [ -n "${{ inputs.version }}" ]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION="$(next_stable_version "${{ inputs.bump }}")"
            fi

            if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable releases on main must use X.Y.Z; got ${VERSION}" >&2
              exit 1
            fi

            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "name=SmoothNAS v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(date -u +%Y.%m%d.%H%M)-$(git rev-parse --short HEAD)"
            if [ -n "${{ inputs.version }}" ]; then
              VERSION="${{ inputs.version }}"
            fi
            echo "channel=testing" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tag=testing-${VERSION}" >> "$GITHUB_OUTPUT"
            echo "name=SmoothNAS v${VERSION} (testing)" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Read pinned SmoothKernel release tag
        id: smoothkernel
        run: |
          set -euo pipefail
          TAG="$(head -n 1 iso/smoothkernel-version | tr -d '[:space:]')"
          [ -n "$TAG" ] || { echo "iso/smoothkernel-version is empty" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Pinned to SmoothKernel release: $TAG"

      - name: Read pinned smoothfs ref
        id: smoothfs_ref
        run: |
          set -euo pipefail
          REF="$(grep '^SMOOTHFS_REPO_REF=' iso/build-iso.sh | grep -oE '[0-9a-f]{40}' | head -n1)"
          [ -n "$REF" ] || { echo "Could not extract SMOOTHFS_REPO_REF from iso/build-iso.sh" >&2; exit 1; }
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Pinned to smoothfs ref: $REF"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            runner: [self-hosted, linux]
          - deb_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # isolinux + syslinux-utils are BIOS-only x86 tools and are not
          # in the arm64 archive; only the amd64 leg needs them.
          bios_pkgs=""
          if [ "${{ matrix.deb_arch }}" = "amd64" ]; then
            bios_pkgs="isolinux syslinux-utils"
          fi
          sudo apt-get install -y \
            xorriso $bios_pkgs cpio gzip file curl \
            libpam0g-dev gcc dpkg-dev xz-utils ripgrep \
            pkg-config lxc-dev

      - name: Set up Go on self-hosted Linux
        if: ${{ contains(matrix.runner, 'self-hosted') }}
        shell: bash
        run: |
          set -euo pipefail
          go_version="$(awk '$1 == "go" { print $2; exit }' tierd/go.mod)"
          if [ -z "$go_version" ]; then
            echo "Could not determine Go version from tierd/go.mod" >&2
            exit 1
          fi
          case "$(uname -m)" in
            x86_64) go_arch="amd64" ;;
            aarch64|arm64) go_arch="arm64" ;;
            *) echo "Unsupported Go architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="/tmp/go-${go_version}.linux-${go_arch}.tar.gz"
          go_root="/tmp/smoothnas-go-${go_version}"
          rm -rf "$go_root"
          curl -fsSL "https://go.dev/dl/go${go_version}.linux-${go_arch}.tar.gz" -o "$archive"
          mkdir -p "$go_root"
          tar -C "$go_root" --strip-components=1 -xzf "$archive"
          "$go_root/bin/go" version
          go_path="${RUNNER_TEMP:-/tmp}/smoothnas-go-path"
          go_mod_cache="$go_path/pkg/mod"
          go_build_cache="${RUNNER_TEMP:-/tmp}/smoothnas-go-build-cache"
          mkdir -p "$go_mod_cache" "$go_build_cache" "$go_path/bin"
          {
            echo "GOROOT=$go_root"
            echo "GOPATH=$go_path"
            echo "GOMODCACHE=$go_mod_cache"
            echo "GOCACHE=$go_build_cache"
          } >> "$GITHUB_ENV"
          echo "$go_root/bin" >> "$GITHUB_PATH"
          echo "$go_path/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-go@v5
        if: ${{ contains(matrix.runner, 'self-hosted') == false }}
        with:
          go-version-file: tierd/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tierd-ui/package-lock.json

      - name: Build tierd backend
        working-directory: tierd
        env:
          # github.com/msteinert/pam/v2 probes RTLD_NEXT via cgo; on
          # some self-hosted libc header combinations that symbol is
          # only exposed when GNU extensions are explicitly enabled.
          CGO_CFLAGS: "-O2 -g -D_GNU_SOURCE"
        run: CGO_ENABLED=1 go build -ldflags "-X main.version=${{ needs.meta.outputs.version }}" -o ../bin/tierd ./cmd/tierd/

      - name: Build tierd-ui frontend
        working-directory: tierd-ui
        run: |
          echo '//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}' >> .npmrc
          npm ci && npm run build

      - name: Download SmoothKernel + ZFS .debs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p deps/smoothkernel-out
          gh release download "${{ needs.meta.outputs.smoothkernel_tag }}" \
            --repo RakuenSoftware/smoothkernel \
            --pattern '*.deb' \
            --pattern 'SHA256SUMS' \
            --dir deps/smoothkernel-out
          (cd deps/smoothkernel-out && sha256sum -c SHA256SUMS)
          ls -lh deps/smoothkernel-out/

      - name: Checkout smoothiso
        uses: actions/checkout@v4
        with:
          repository: RakuenSoftware/smoothiso
          path: deps/smoothiso

      - name: Build ISO
        env:
          SMOOTHISO_DIR: ${{ github.workspace }}/deps/smoothiso
          SMOOTHKERNEL_DIR: ${{ github.workspace }}/deps/smoothkernel-out
          ZFS_ARTIFACT_DIR: ${{ github.workspace }}/deps/smoothkernel-out
          SMOOTHFS_REPO_URL: https://github.com/RakuenSoftware/smoothfs.git
          DEB_ARCH: ${{ matrix.deb_arch }}
          # Installer UI is whiptail; no browser is bundled or used.
          INSTALLER_BROWSER_DEFERRED: '1'
        run: |
          chmod +x iso/build-iso.sh
          ./iso/build-iso.sh ${{ needs.meta.outputs.version }}

      - name: Stage per-arch release artifacts
        run: |
          set -euo pipefail
          mkdir -p stage
          cp "iso/output/smoothnas-${{ needs.meta.outputs.version }}-${{ matrix.deb_arch }}.iso" \
             "stage/smoothnas-${{ needs.meta.outputs.version }}-${{ matrix.deb_arch }}.iso"
          cp bin/tierd "stage/tierd-${{ matrix.deb_arch }}"
          # Arch-independent assets are staged from amd64 only so the release
          # job has exactly one copy of each to upload.
          if [ "${{ matrix.deb_arch }}" = "amd64" ]; then
            mkdir -p dist
            tar -czf dist/tierd-ui.tar.gz -C tierd-ui/dist/smoothnas-ui .
            cp dist/tierd-ui.tar.gz stage/tierd-ui.tar.gz
            # Package the smoothfs DKMS source (src/smoothfs/ contents) so the
            # in-product updater can rebuild the kernel module on installed systems.
            tar -czf stage/smoothfs-src.tar.gz -C iso/cache/smoothfs-src/src/smoothfs .
          fi
          ls -lh stage/

      - name: Upload per-arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoothnas-${{ matrix.deb_arch }}
          path: stage
          if-no-files-found: error

  release:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download per-arch artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-input

      - name: Merge release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            src="release-input/smoothnas-${arch}"
            test -d "$src" || { echo "missing artifact for $arch" >&2; exit 1; }
            for f in "$src"/*; do
              name="$(basename "$f")"
              if [ -e "dist/$name" ]; then
                # tierd-ui.tar.gz is staged on amd64 only, but be defensive.
                continue
              fi
              cp "$f" "dist/$name"
            done
          done

          TIERD_AMD64_SHA=$(sha256sum dist/tierd-amd64 | awk '{print $1}')
          TIERD_ARM64_SHA=$(sha256sum dist/tierd-arm64 | awk '{print $1}')
          UI_SHA=$(sha256sum dist/tierd-ui.tar.gz | awk '{print $1}')
          SMOOTHFS_SRC_SHA=$(sha256sum dist/smoothfs-src.tar.gz | awk '{print $1}')
          cat > dist/manifest.json <<EOFM
          {
            "version": "${{ needs.meta.outputs.version }}",
            "channel": "${{ needs.meta.outputs.channel }}",
            "tierd_amd64_sha256": "${TIERD_AMD64_SHA}",
            "tierd_arm64_sha256": "${TIERD_ARM64_SHA}",
            "ui_sha256": "${UI_SHA}",
            "smoothfs_ref": "${{ needs.meta.outputs.smoothfs_ref }}",
            "smoothfs_src_sha256": "${SMOOTHFS_SRC_SHA}"
          }
          EOFM
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.name }}
          draft: false
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: |
            dist/smoothnas-${{ needs.meta.outputs.version }}-amd64.iso
            dist/smoothnas-${{ needs.meta.outputs.version }}-arm64.iso
            dist/tierd-amd64
            dist/tierd-arm64
            dist/tierd-ui.tar.gz
            dist/smoothfs-src.tar.gz
            dist/manifest.json
          generate_release_notes: true
