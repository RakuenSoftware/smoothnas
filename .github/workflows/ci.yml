name: CI

on:
  pull_request:
    branches: [main, testing]

permissions:
  contents: read
  packages: read

jobs:
  lint-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: tierd/go.mod

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev build-essential

      - name: Run go vet
        working-directory: tierd
        run: CGO_ENABLED=1 go vet ./...

  build-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: tierd/go.mod

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev build-essential

      - name: Build
        working-directory: tierd
        run: CGO_ENABLED=1 go build -o ../bin/tierd ./cmd/tierd/

  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: tierd/go.mod

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev build-essential


      - name: Run Go tests
        working-directory: tierd
        run: CGO_ENABLED=1 go test ./... -count=1

  build-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tierd-ui/package-lock.json

      - name: Install dependencies
        working-directory: tierd-ui
        run: |
          echo '//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}' >> .npmrc
          npm ci

      - name: Build
        working-directory: tierd-ui
        run: npm run build

  test-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tierd-ui/package-lock.json

      - name: Install dependencies
        working-directory: tierd-ui
        run: |
          echo '//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}' >> .npmrc
          npm ci

      - name: Type check
        working-directory: tierd-ui
        run: npx tsc --noEmit

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test the Updates page in Chromium
        run: |
          python -m pip install playwright==1.64.0
          python -m playwright install --with-deps chromium
          npm --prefix tierd-ui run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5173/ >/dev/null && break
            sleep 1
          done
          python tests/browser/updates_page.py

  test-runtime-network:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tierd/go.mod
      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y lxc-dev pkg-config patch nftables iptables iproute2
      - name: Build patched runtime
        run: scripts/build-smoothnas-runtime.sh
      - name: Test repeated bridge reconciliation preserves NAT and published ports
        run: |
          cd runtime/build/LXC2Docker
          GOTOOLCHAIN=auto go test -c -o /tmp/runtime-network.test ./internal/lxc
          sudo env LXC2DOCKER_NETWORK_TEST=1 unshare --net /tmp/runtime-network.test -test.run '^TestEnsureBridgeNATRemainsBounded$' -test.v

  package:
    # The smoothnas package is otherwise only built by the release pipeline.
    # Build it, and install it the way the installer does: with apt, from the
    # Smooth* archive, on Debian 13. That pulls SmoothKernel, OpenZFS and
    # smoothfs from the archive and has DKMS build both modules against
    # SmoothKernel.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tierd/go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tierd-ui/package-lock.json
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev build-essential lxc-dev pkg-config patch
      - name: Build tierd, the UI and the plugin runtime
        run: |
          (cd tierd && CGO_ENABLED=1 go build -ldflags "-X main.version=0.0.0-ci" -o ../bin/tierd ./cmd/tierd/)
          (cd tierd-ui && echo '//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}' >> .npmrc && npm ci && npm run build)
          scripts/build-smoothnas-runtime.sh
      - name: Build the package
        run: |
          ./packaging/build-deb.sh 0.0.0-ci amd64 bin/tierd bin/docker-lxc-daemon tierd-ui/dist/smoothnas-ui dist
          dpkg-deb --info dist/smoothnas_0.0.0-ci_amd64.deb
      - name: Install it with apt on Debian 13
        run: |
          # Job logs need admin rights to read; on failure the tail goes into
          # an annotation, which anyone can read.
          set -o pipefail
          trap 'echo "::error title=smoothnas package install failed::$(tail -n 60 install.log | tr -d "\r" | awk "BEGIN{ORS=\"%0A\"} {gsub(/%/,\"%25\"); print}")"' ERR
          docker run --rm -v "$PWD:/src:ro" debian:trixie bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq ca-certificates systemd >/dev/null
            # What packages.sh sets up before installing smoothnas.
            install -D -m 644 /src/packaging/smoothnas/usr/share/keyrings/smooth-archive-keyring.gpg \
              /usr/share/keyrings/smooth-archive-keyring.gpg
            printf "%s\n" \
              "deb [signed-by=/usr/share/keyrings/smooth-archive-keyring.gpg] https://updates.rakuensoftware.com/public common main" \
              "deb [signed-by=/usr/share/keyrings/smooth-archive-keyring.gpg] https://updates.rakuensoftware.com/public smoothnas main" \
              > /etc/apt/sources.list.d/smoothapt-install.list
            printf "Package: linux-image-* linux-headers-*\nPin: release o=Debian\nPin-Priority: -1\n" \
              > /etc/apt/preferences.d/smoothnas-no-debian-kernel
            apt-get update
            apt-get install -y /src/dist/smoothnas_0.0.0-ci_amd64.deb
            rm /etc/apt/sources.list.d/smoothapt-install.list
            dpkg-query -W smoothnas linux-image-smoothkernel openzfs-zfsutils openzfs-zfs-dkms smoothfs-dkms smoothfs-samba-vfs samba
            if ls /boot/vmlinuz-* | grep -v smoothkernel; then echo "a non-SmoothKernel kernel was installed" >&2; exit 1; fi
            test -x /usr/sbin/tierd
            test -f /usr/share/tierd-ui/index.html
            test -x /usr/lib/smoothnas/docker-lxc-daemon
            for unit in tierd tierd-host-init smoothnas-runtime smoothnas-tls-init smoothnas-gpu-init; do
              systemctl is-enabled "$unit.service"
            done
            # DKMS built both storage modules for SmoothKernel.
            kver=$(dpkg-query -W -f="\${Depends}" linux-image-smoothkernel | sed -n "s/^linux-image-\([^ ,]*\).*/\1/p")
            dkms status
            dkms status -k "$kver" | grep -E "^zfs/.*: installed"
            dkms status -k "$kver" | grep -E "^smoothfs/.*: installed"
            # The package keeps its own apt source; apt reads it cleanly.
            apt-get update > /tmp/update.log 2>&1 || { cat /tmp/update.log; exit 1; }
            if grep -E "^(Err|E):" /tmp/update.log; then exit 1; fi
          ' 2>&1 | tee install.log
